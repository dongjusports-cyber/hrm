# DJ HRM — Docker Compose (Local Win10 trước, Cloud VPS sau)
# Dịch vụ: api + web + postgres + redis — Modular Monolith, vừa đủ cho ~500 NV

services:
  postgres:
    image: postgres:16-alpine
    container_name: djhrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djhrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djhrm_local_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-djhrm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djhrm} -d ${POSTGRES_DB:-djhrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: djhrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: djhrm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://djhrm:djhrm_local_change_me@postgres:5432/djhrm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: djhrm-web
    restart: unless-stopped
    environment:
      # ĐT/LAN: dùng proxy Vite → /api (tránh localhost trên máy điện thoại)
      VITE_API_BASE_URL: same-origin
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  redisdata:
